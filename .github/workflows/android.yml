name: Build and Test React Native App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Free Disk Space
        run: |
          echo "==== Disk space before cleanup ===="
          df -h

          # Remove heavy pre-installed software suites not needed for React Native
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

          # Purge ONLY the heavy pre-installed emulator system images inside the SDK
          sudo rm -rf /usr/local/lib/android/sdk/system-images/*
          sudo rm -rf /usr/local/lib/android/sdk/emulator

          # Clean up Docker images cached on the runner
          sudo docker image prune --all --force

          echo "==== Disk space after cleanup ===="
          df -h

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android Native Folder (Prebuild)
        run: npx expo prebuild --platform android

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"
          # cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/terms-of-service"
          build-scan-terms-of-use-agree: "yes"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ORG_GRADLE_PROJECT_bundleInDebug=true ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      # Upload the APK so the next job can access it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  firebase-test-lab:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && !startsWith(github.head_ref, 'dependabot/') && !startsWith(github.ref, 'refs/heads/dependabot/') }}
    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v8
        with:
          name: app-debug.apk

      - name: Check for Firebase Credentials
        id: secret-check
        run: |
          if [ -z "\${{ secrets.GCP_FIREBASE_CREDENTIALS }}" ]; then
            echo "⚠️ GCP_FIREBASE_CREDENTIALS secret is not available (likely a fork)."
            echo "⏩ Breaking job early to avoid failures."
            echo "should_skip=true" >> \$GITHUB_OUTPUT
          else
            echo "🚀 GCP_FIREBASE_CREDENTIALS secret found."
            echo "should_skip=false" >> \$GITHUB_OUTPUT
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_FIREBASE_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Run Robo Test in Firebase Test Lab
        if: ${{ hashFiles('app-debug.apk') != '' }}
        run: |
          gcloud firebase test android run \
            --type robo \
            --app app-debug.apk \
            --device model=MediumPhone.arm,version=30,locale=en,orientation=portrait
